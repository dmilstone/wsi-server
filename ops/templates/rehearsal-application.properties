# Production-mode rehearsal: isolated, deidentified data only.
wsi.environment=production
wsi.image-directory=/Users/dm026/wsi-images/production-rehearsal
wsi.scan-recursive=true

wsi.export.max-pixels=16000000

# Bind rehearsal to this Mac only. It is not intended for user access.
server.address=127.0.0.1
server.port=8083
server.servlet.session.timeout=12h

wsi.annotations.directory=/Users/dm026/wsi-production-rehearsal/data/annotations
wsi.annotations.default-user=local

wsi.security.viewer-password=${WSI_VIEWER_PASSWORD:viewer}
wsi.security.annotator-password=${WSI_ANNOTATOR_PASSWORD:annotator}
