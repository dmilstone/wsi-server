<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WSI Viewer Help Directory</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #090d12; color: #f2f5f8; }
        main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
        h1 { margin: 0 0 8px; font-size: 1.6rem; }
        p { margin: 0 0 24px; color: #b5c0cc; }
        .hub { display: grid; gap: 10px; }
        a, button {
            display: flex; align-items: center; justify-content: flex-start;
            min-height: 44px; padding: 10px 14px; border-radius: 8px;
            border: 1px solid #40546a; background: #18212c; color: #f2f5f8;
            text-decoration: none; cursor: pointer; text-align: left;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: inherit;
            -webkit-appearance: none;
            appearance: none;
        }
        a:hover, button:hover { background: #202c39; border-color: #4d94d8; }
    </style>
</head>
<body>
<main>
    <h1>Help directory</h1>
    <p>Documentation and operations launchers. The viewer tab stays open.</p>
    <nav class="hub" aria-label="Help directory">
        <a id="dashboard-link" href="https://127.0.0.1:8084/" target="_blank" rel="noopener noreferrer">Dashboard</a>
        <a id="services-link" href="https://127.0.0.1:8084/services" target="_blank" rel="noopener noreferrer">Launch / quit services</a>
        <a id="user-guide-link" href="/help?v=20260910" target="_blank" rel="noopener noreferrer">User Guide</a>
        <a id="viewer-quick-guide-link" href="/help/viewer-guide.html?v=20260910" target="_blank" rel="noopener noreferrer">Viewer Quick Guide</a>
        <a id="admin-ops-guide-link" href="/help/admin-ops-guide.html?v=20260910" target="_blank" rel="noopener noreferrer">Admin and Ops Guide</a>
        <button type="button" id="workstation-admin-tools-btn">Admin</button>
        <a id="local-operations" href="/local-operations/" target="_blank" rel="noopener noreferrer">Local Operations</a>
    </nav>
</main>
<script>
    const OPS_FALLBACK_URL = "/local-operations/";
    const ADMIN_VIEWER_URL = "/?admin=1";

    function opsHost() {
        const host = String(window.location.hostname || "").toLowerCase();
        return (!host || host === "localhost") ? "127.0.0.1" : host;
    }

    function opsAbsoluteUrl(path) {
        const suffix = path && path.charAt(0) === "/" ? path : "/" + String(path || "");
        return "https://" + opsHost() + ":8084" + suffix;
    }

    function openUrl(url) {
        const opened = window.open(url, "_blank", "noopener,noreferrer");
        if (!opened) window.location.assign(url);
    }

    async function isOpsListening(url) {
        const controller = typeof AbortController === "function" ? new AbortController() : null;
        const timer = window.setTimeout(() => controller?.abort?.(), 800);
        try {
            await fetch(url, { mode: "no-cors", cache: "no-store", signal: controller?.signal });
            return true;
        } catch (_error) {
            return false;
        } finally {
            window.clearTimeout(timer);
        }
    }

    async function openOpsOrFallback(path) {
        const url = opsAbsoluteUrl(path);
        const listening = await isOpsListening(url);
        openUrl(listening ? url : OPS_FALLBACK_URL);
    }

    function openAdminTools() {
        const opener = window.opener;
        if (opener && !opener.closed) {
            try {
                if (typeof opener.AnnotationAdapter?.openFloatingAdminPalette === "function") {
                    opener.AnnotationAdapter.openFloatingAdminPalette(opener.document);
                } else {
                    opener.postMessage({ type: "wsi-open-admin-palette" }, window.location.origin);
                }
                opener.focus();
                window.close();
                window.setTimeout(() => {
                    if (!window.closed) window.location.assign(ADMIN_VIEWER_URL);
                }, 150);
                return;
            } catch (_error) { /* fall through */ }
        }
        window.location.assign(ADMIN_VIEWER_URL);
    }

    (function retargetOpsLinks() {
        document.querySelectorAll('a[href^="https://127.0.0.1:8084"]').forEach((link) => {
            const parsed = new URL(link.getAttribute("href"), window.location.href);
            link.href = opsAbsoluteUrl(parsed.pathname + parsed.search + parsed.hash);
        });
    })();

    document.getElementById("dashboard-link")?.addEventListener("click", event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
        event.preventDefault();
        void openOpsOrFallback("/");
    });
    document.getElementById("services-link")?.addEventListener("click", event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
        event.preventDefault();
        void openOpsOrFallback("/services");
    });
    document.getElementById("workstation-admin-tools-btn")?.addEventListener("click", event => {
        event.preventDefault();
        openAdminTools();
    });
</script>
</body>
</html>
