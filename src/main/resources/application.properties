# Root directory containing image files and optional nested sample directories.
wsi.image-directory=/Users/dm026/wsi-slides
wsi.scan-recursive=true

# Portable live discovery. Runtime additions must remain unchanged across this
# window; published entries are retained until restart if later absent.
wsi.discovery.refresh-interval=30s
wsi.discovery.stability-window=10s

# Opt-in, privacy-safe Bio-Formats stage diagnostics. Keep disabled in production
# except for a bounded diagnostic run; records opaque correlations, never paths or metadata.
wsi.diagnostic-timing.enabled=${WSI_DIAGNOSTIC_TIMING:false}

# Viewer environment identification. Unknown values safely use the production appearance.
wsi.environment=${WSI_ENVIRONMENT:production}

# Bound both source and scaled output allocations for exports (16 megapixels by default).
# Increase only when the server heap can accommodate raw channel buffers, RGB output, and PNG encoding.
wsi.export.max-pixels=16000000

# Listen on all network interfaces. Restrict this with a firewall or reverse proxy.
server.address=0.0.0.0
server.port=8080

# Browser sessions isolate display settings between workstations.
server.servlet.session.timeout=12h

# Milestone 12.1A: persistent, user-specific annotation documents.
# The browser will send X-WSI-User once the annotation UI is added in 12.1B/12.1C.
wsi.annotations.directory=${user.home}/.wsi-server/annotations
wsi.annotations.default-user=local

# Milestone 13.1: credentials for the two local accounts. Override these values
# with environment variables outside local development.
wsi.security.viewer-password=${WSI_VIEWER_PASSWORD:viewer}
wsi.security.annotator-password=${WSI_ANNOTATOR_PASSWORD:annotator}
